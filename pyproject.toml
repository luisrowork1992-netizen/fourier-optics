[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-optics"
version = "0.1.0"
description = "Scalar diffraction: angular-spectrum propagation, Fraunhofer patterns and the Talbot effect"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["diffract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
